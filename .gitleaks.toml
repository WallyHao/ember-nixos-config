title = "Hearth secret scan"

[extend]
useDefault = true

[[rules]]
id = "hearth-aws-access-key"
description = "AWS access key"
regex = '''AKIA[0-9A-Z]{16}'''

[[rules]]
id = "hearth-private-key"
description = "Private key block"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''

[[rules]]
id = "hearth-generic-credential"
description = "Generic credential assignment"
regex = '''(?i)(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*["'][A-Za-z0-9_./+=-]{16,}["']'''

[allowlist]
description = "The untracked local hash still exists in historical commits; the current file is a loader."
paths = [
  '''^users/wallyhao/bootstrap-password\.nix$''',
]
