name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Format, shell, path/secret scans, flake checks
        run: nix-shell ./shell.nix --run 'just check'
      - name: Build system-preview and phase-2 config checks
        run: |
          ./scripts/hearth build
          nix build --no-link --no-update-lock-file \
            path:.#checks.x86_64-linux.desktop-config \
            path:.#checks.x86_64-linux.eval-user-environment

  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run required VM checks
        run: |
          nix build --no-link --no-update-lock-file \
            path:.#checks.x86_64-linux.vm-accounts \
            path:.#checks.x86_64-linux.vm-persistence \
            path:.#checks.x86_64-linux.vm-offline-boot \
            path:.#checks.x86_64-linux.vm-offline-desktop \
            path:.#checks.x86_64-linux.vm-offline-link \
            path:.#checks.x86_64-linux.vm-desktop \
            path:.#checks.x86_64-linux.vm-user-environment \
            path:.#checks.x86_64-linux.vm-connectivity
